syntax = "proto3";

option csharp_namespace = "GrpcCommonNet.Library.Stock";

import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "protos/common/general.proto";
import "protos/common/contragent.proto";
import "protos/common/stock.proto";
import "protos/common/documenttype.proto";

package stock;

// Сервисы
service StockServices {
    // *** методы работы со складом
    rpc GetListStock(ListStockRequest) returns (ListStockResponse);                     // Получить список по фильтру

    rpc GetListOperationsStock(ListOperationsStockRequest) returns (ListOperationsStockResponse); // Получить список складских операций по фильтру
}

message  ListStockRequest {
    string name = 1;                                    // Фильтр наименования склада 
    optional google.protobuf.FieldMask field_mask = 2;  // Маска полей

}

message ListStockResponse {
    Common.Result result = 1;
    repeated Common.Stock stocks = 2;
}


message ListOperationsStockRequest {
    optional google.protobuf.Timestamp start_date = 1;         // формат YYYY-MM-DD
    optional google.protobuf.Timestamp end_date = 2;           // формат YYYY-MM-DD
    Common.Contragent contragent_to = 3;
    Common.Contragent contragent_from = 4;
    Common.DocumentType type = 5;
    Common.Stock stock = 6;
    optional google.protobuf.FieldMask field_mask = 7; // Маска полей {"paths": ["currency_id","currency_code", "currency_abbrev", "currency_order_number"]}

}

message ListOperationsStockResponse {
    Common.Result result = 1;
    repeated Common.StockOperation operation = 2; 
}