syntax = "proto3";

option csharp_namespace = "GrpcCommonNet.Library.Permission";

import "google/protobuf/field_mask.proto";
import "protos/common/general.proto";
import "protos/common/permission.proto";
import "protos/common/user.proto";

package permission;

service PermissionServices {
	rpc GetPermission (GetPermissionRequest) returns (GetPermissionResponse);				// Полчить права на объект 

	// Объекты
	rpc GetRightObjects(GetRightObjectsRequest) returns (GetRightObjectsResponse);			// 
	rpc AddRightObject(RightObjectRequest) returns(RightObjectResponse);					// 
	rpc EditRightObject(RightObjectRequest) returns(RightObjectResponse);					// 
	rpc DeleteRightObject(DeleteRightObjectRequest) returns(DeleteRightObjectResponse);		//
	rpc MoveRightObject(MoveRightObjectRequest) returns(BoolResponse);						//
	rpc GetRightValues(GetRightValuesRequest) returns(GetRightValuesResponse);				//

	rpc IsRightObjectNameExists(IsRightObjectNameExistsRequest) returns(BoolResponse);			// Возвращает true если имя уже существует.
	rpc IsRightObjectCodeExists(IsRightObjectCodeExistsRequest) returns(BoolResponse);			// Возвразает true если код уже существует.
	rpc IsRightObjectHasForeignKey(IsRightObjectHasForeignKeyRequest) returns(BoolResponse);	// Возвращает true если на объект права ссылаются внешние ключи.
	rpc IsRightObjectHasChilds(IsRightObjectHasChildsRequest) returns(BoolResponse);			// Возвращает true если объект имеет детей.

	rpc GetSubjects(GetSubjectsRequest) returns(GetSubjectsResponse); // Получить субъектов по user_id

	// Роли
	rpc GetRoles(GetRolesRequest) returns(GetRolesResponse);							// Получить список ролей
	rpc AddRole(RoleRequest) returns(RoleResponse);										// Добавить новую роль
	rpc EditRole(RoleRequest) returns(RoleResponse);									// Редактировать роль
	rpc DeleteRole(DeleteRoleRequest) returns(UndeleteRoleResponse);						// Удалить помеченные Роли
	rpc DuplicateRole(DuplicateRoleRequest) returns(RoleResponse);									// Дублировать роль
	rpc IsNameExistsRole(IsNameExistRoleRequest) returns(BoolResponse);					// Проверка имени роли на существование (функция)		
	rpc IsDefaultRoleExistsRole(IsDefaultRoleExistsRoleRequest) returns(BoolResponse);	// Проверка на существование роли по умолчанию (функция)	
	rpc CanDeleteRole(CanDeleteRoleRequest) returns(BoolResponse);						// Проверка на возможность удаления (функция)	

	// Субъекты

}

enum DbType {
	DB_LOCAL = 0;
	DB_GLOBAL =  1;
}

message GetPermissionRequest {
	Common.PermissionDbSources db_sources = 1;
	Common.PermissionSubjects subjects = 2;
	string object_name = 3;
}

message GetPermissionResponse {
	Common.Result result = 1;
	Common.Permission permission = 2;
}

message IsRightObjectNameExistsRequest {
	string name = 1;
	int32 excludeId = 2;
	Common.PermissionDbSources db_sources = 3;
	DbType db_type =4;
}

message IsRightObjectCodeExistsRequest {
	string code = 1;
	int32 excludeId = 2;
	Common.PermissionDbSources db_sources = 3;
	DbType db_type =4;
}

message IsRightObjectHasForeignKeyRequest {
	int32 id = 1;
	Common.PermissionDbSources db_sources = 2;
	DbType db_type =3;
}

message IsRightObjectHasChildsRequest {
	int32 id = 1;
	Common.PermissionDbSources db_sources = 2;
	DbType db_type = 3;
}

message BoolResponse {
	Common.Result result = 1;
	bool response = 2;
}

message GetRightObjectsRequest {
	Common.PermissionDbSources db_sources = 1;
	google.protobuf.FieldMask field_mask = 2;
	DbType db_type = 3;
}

message GetRightObjectsResponse  {
	Common.Result result = 1;
	repeated Common.RightObject right_objects = 2;
}

message RightObjectRequest {
	Common.RightObject right_object = 1;
	Common.PermissionDbSources db_sources = 2;
	DbType db_type = 3;
	google.protobuf.FieldMask field_mask = 4;
}

message RightObjectResponse {
	Common.Result result = 1;
	Common.RightObject right_object = 2;
}

message DeleteRightObjectRequest {
	int32 id = 1;
	Common.PermissionDbSources db_sources = 2;
	DbType db_type = 3;
}
message DeleteRightObjectResponse {
	Common.Result result = 1;
	bool deleted = 2;
}

message MoveRightObjectRequest {
	int32 id = 1;
	int32 parent_id = 2;
	Common.PermissionDbSources db_sources = 3;
	DbType db_type = 4;
	google.protobuf.FieldMask field_mask = 5;
}

message GetSubjectsRequest {
	Common.User user = 1;
	string db_name = 2;
}

message GetSubjectsResponse {
	Common.Result result = 1;
	Common.Subject subject = 2;
}

message GetRightValuesResponse {
	Common.Result result = 1;
	repeated Common.RightValueValue right_value_values = 2;
}

message GetRightValuesRequest {
	string db_name = 1;
}

message  GetRolesRequest {
	string db_name  = 1;
	google.protobuf.FieldMask field_mask = 2;
}

message GetRolesResponse {
	Common.Result result = 1;
	repeated Common.Role roles = 2;
}

message RoleRequest {
	string db_name  = 1;
	Common.Role role = 2;
}

message RoleResponse {
	Common.Result result = 1;
	Common.Role role = 2;
}

message DeleteRoleRequest {
	string db_name  = 1;
	repeated int32 ids = 2;
}

message UndeleteRoleResponse {
	Common.Result result = 1;
	repeated int32 undeleted_ids = 2;
}

message IsNameExistRoleRequest {
	string db_name  = 1;
	string name = 2;
}

message IsDefaultRoleExistsRoleRequest {
	string db_name = 1;
}

message CanDeleteRoleRequest {
	string db_name = 1;
	Common.Role role = 2;
}

message DuplicateRoleRequest {
	string db_name = 1;
	Common.Role source_role = 2;
	Common.Role destination_role = 3;
}