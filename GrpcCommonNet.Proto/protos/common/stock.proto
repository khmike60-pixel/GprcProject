syntax = "proto3";

option csharp_namespace = "GrpcCommonNet.Library.Common";

import "google/protobuf/timestamp.proto";
import "protos/common/documenttype.proto";
import "protos/common/contragent.proto";
import "protos/common/general.proto";
import "protos/common/geolocation.proto";

package Common;

message Stock {
	int32 id = 1;
	string name = 2;
	Common.Place place = 3;
	Common.Geolocation geolocation = 4;
}

enum StatusOperation {
	NEW = 0;
	EXECUTED = 1;
}


message StockOperation {
	int32 id = 1;
	Common.DocumentType document_type = 2;
	string number = 3;
	google.protobuf.Timestamp date = 4;
	StatusOperation status = 5;
	Common.Contragent contragent_to = 6;
	Common.Contragent contragent_from = 7;
	Stock stock_to =8;
	Stock stock_from = 9;
	Common.DecimalValue sum_out  = 10;
	Common.DecimalValue sum_inp = 11;
}