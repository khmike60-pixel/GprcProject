syntax = "proto3";

option csharp_namespace = "GrpcCommonNet.Library.Common";

import "google/protobuf/timestamp.proto";
import "protos/common/general.proto";

package Common;


// Модель валюта
message Currency {
    int32 id = 1;
    optional string code = 2;
    string abbrev = 3; // всегда присутствует
    optional string name = 4;
    optional int32 scale = 5;
    optional int32 dec = 6;
    optional int32 order_number  = 7;
    optional bool is_visible = 8;
}


/////////////////////
// Модель курса валюты
message Rate {
    int32 rate_id = 1;
    int32 currency_id = 2;
    google.protobuf.Timestamp date = 3;     
    Common.DecimalValue rate = 4;          
}

message CurrencyRate {
    int32 id = 1;
    string abbrev = 2;
    string name = 3;
    Common.DecimalValue rate = 4;
    google.protobuf.Timestamp date = 5;
}
