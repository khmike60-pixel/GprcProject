syntax = "proto3";

option csharp_namespace = "GrpcCommonNet.Library.Department";

import "google/protobuf/field_mask.proto";
import "protos/common/general.proto";
import "protos/common/department.proto";

package department;

service DepartmentServices {
	rpc GetDepartment(DepartmentRequest) returns (DepartmentResponse);                        // Получить по id
	rpc GetListDepartment(ListDepartmentRequest) returns (ListDepartmentResponse);            // Получить список по фильтру
	rpc CreateDepartment(CreateDepartmentRequest) returns (DepartmentResponse);               // Создать 
	rpc UpdateDepartment(UpdateDepartmentRequest) returns (DepartmentResponse);               // Редактировать 
	rpc DeleteDepartment(DeleteDepartmentRequest) returns (DeleteDepartmentResponse);         // Удалить по id
	rpc DeleteIdsDepartment(DeleteIdsDepartmentRequest) returns (UndeletedIdsDepartmentResponse); // Удалить по списку id	
}

message DepartmentRequest {
	int32 id = 1;
	optional google.protobuf.FieldMask field_mask = 2; // Маска полей {"paths": ["id","name", "short", "symbol"]}
}

message DepartmentResponse {
	Common.Department department = 1;
	Common.Result result = 2;
}

// Запросы списка подразделений по фильтру
message ListDepartmentRequest {
	oneof filter {
		string symbol = 1;             // фильтр или по аббревиатуре 
		string department_short = 2;   // фильтр или по короткому названию подразделения
	};
	optional string order_by = 3;                    // Порядок сортировки, например "department_name asc, department_short asc"
	optional google.protobuf.FieldMask field_mask = 4; // Маска полей {"paths": ["id","name", "short", "symbol"]}
}

message ListDepartmentResponse {
	repeated Common.Department departments = 1;
	Common.Result result = 2;
}

message CreateDepartmentRequest {
	Common.Department department = 1;
}

message UpdateDepartmentRequest {
	Common.Department department = 1;
}

message DeleteDepartmentRequest {
	int32 id = 1;
}

message DeleteDepartmentResponse {
	Common.Result result = 1;
}

message DeleteIdsDepartmentRequest {
	repeated int32 ids = 1;
}

message UndeletedIdsDepartmentResponse {
	Common.Result result = 1;
	repeated int32 undeleted_ids = 2;
}
